name: Bug report
description: Report a problem with one of the projects.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - Zelly's Guard
        - Zelly's Nexus
        - BlockProt Reloaded
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project version
      description: "The version shown by the plugin (for example, 0.1.0-alpha)."
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Server platform and version
      description: "For example: Paper 26.3 build 200, Java 25."
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected to happen and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      render: text
    validations:
      required: false
